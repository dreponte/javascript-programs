
<!DOCTYPE html>
<html>
<head>
    <title>Income Tax Calculator</title>
</head>
<body>

    <h2>Income Tax Calculator</h2>

    <label>Enter Taxable Income:</label>
    <input type="number" id="income" placeholder="Enter taxable income">

    <button onclick="computeTax()">Compute Tax</button>

    <h3 id="result"></h3>

    <script>
        function computeTax() {

            let income = parseFloat(document.getElementById("income").value);
            let tax;

            if (document.getElementById("income").value === "") {
                document.getElementById("result").innerHTML =
                    "Please enter your taxable income.";
                return;
            }

            if (income < 0) {
                document.getElementById("result").innerHTML =
                    "Please enter a valid taxable income.";
                return;
            }

            if (income <= 250000) {
                tax = 0;
            }
            else if (income <= 400000) {
                tax = (income - 250000) * 0.20;
            }
            else if (income <= 800000) {
                tax = 30000 + (income - 400000) * 0.25;
            }
            else if (income <= 2000000) {
                tax = 130000 + (income - 800000) * 0.30;
            }
            else if (income <= 8000000) {
                tax = 490000 + (income - 2000000) * 0.32;
            }
            else {
                tax = 2410000 + (income - 8000000) * 0.35;
            }

            document.getElementById("result").innerHTML =
                "Taxable Income: P" + income.toFixed(2) +
                "<br>Income Tax: P" + tax.toFixed(2);
        }
    </script>

</body>
</html>
